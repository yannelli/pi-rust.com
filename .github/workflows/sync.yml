name: Sync from pi-rust

# Keeps pi-rust.com on the latest pi-rust release. Every hour it syncs the docs,
# changelog, benchmark, and release data from yannelli/pi-rust. When they changed,
# or the live site is on an older release, it builds, renders the social cards,
# runs the tests, commits the content, deploys, and submits the sitemap to
# IndexNow. A failed step stops the run, so a build that fails its tests never
# deploys. A push made with GITHUB_TOKEN does not start the CI workflow, so this
# job tests and deploys on its own.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build, test, and deploy even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time, so two runs never commit or deploy over each other.
concurrency:
  group: sync-from-pi-rust
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a new release or content
        id: check
        run: |
          latest=$(jq -r .tag src/data/upstream.json)
          live=$(curl -fsS --max-time 20 https://pi-rust.com/version.json | jq -r .tag) || live=none
          changed=false
          git diff --quiet -- src/content src/data || changed=true
          update=false
          if [ "$changed" = true ] || [ "$latest" != "$live" ] || [ "${{ inputs.force }}" = true ]; then update=true; fi
          echo "latest $latest, live $live, content changed: $changed"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.check.outputs.update == 'true'
        run: npm run build
      - name: Render the social cards
        if: steps.check.outputs.update == 'true'
        run: CHROME_BIN=google-chrome npm run og
      - name: Test
        if: steps.check.outputs.update == 'true'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: '1'
      - name: Commit the content
        if: steps.check.outputs.update == 'true'
        run: |
          if git diff --quiet -- src/content src/data public/og; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content src/data public/og
          git commit -m "chore(content): sync pi-rust ${{ steps.check.outputs.tag }}"
          git push
      - name: Deploy to Cloudflare
        if: steps.check.outputs.update == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Submit the sitemap to IndexNow
        if: steps.check.outputs.update == 'true'
        run: npm run indexnow || echo "IndexNow submission failed; the site is deployed"
